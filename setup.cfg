[metadata]
name = broditech-odoo-migrations
version = 0.5.0
description = Project-specific OCA database migrations for Odoo 19
long_description = file: README.md
long_description_content_type = text/markdown
license = AGPL-3.0-or-later

[options]
python_requires = >=3.9
package_dir =
    = src
packages =
    broditech_odoo_migrations
    odoo.upgrade
include_package_data = True
install_requires =
    odoo_upgrade @ git+https://github.com/odoo/upgrade-util@master

[options.package_data]
odoo.upgrade =
    base/*/*.py
    l10n_es_aeat_mod347/*/*.py
    queue_job/*/*.py
